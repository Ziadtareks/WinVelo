name: Release

# Builds the portable release in CI from a version tag (for example v1.0.2), writes SHA-256 hash files,
# adds a build provenance attestation and creates a DRAFT GitHub release for a maintainer to review.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write      # create the draft release
  id-token: write      # build provenance attestation
  attestations: write  # build provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  release:
    name: Build, hash, attest and draft the release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check that the tag matches the version in Directory.Build.props
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          [xml]$props = Get-Content Directory.Build.props
          $propsVersion = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($propsVersion -ne $version) {
            throw "Tag $tag does not match <Version>$propsVersion</Version> in Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore WinVelo.sln

      - name: Build
        run: dotnet build WinVelo.sln --configuration Release --no-restore

      - name: Validate catalog
        run: dotnet run --project tools/CatalogValidator/CatalogValidator.csproj --configuration Release --no-build

      - name: Check README tweak count
        run: dotnet run --project tools/CatalogStats/CatalogStats.csproj --configuration Release --no-build

      - name: Unit tests
        run: dotnet test src/WinVelo.Tests/WinVelo.Tests.csproj --configuration Release --no-build

      - name: Build the portable folder
        shell: pwsh
        run: .\build\publish.ps1 -Version "${{ steps.version.outputs.version }}" -SkipZip

      # ------------------------------------------------------------------------------------------
      # Code signing (OFF by default). WinVelo has no certificate yet, so nothing is signed and
      # nothing pretends to be. To turn signing on:
      #   1. Get a certificate. SignPath Foundation signs open-source projects for free:
      #      https://signpath.org  (see docs/SIGNING.md).
      #   2. Add the secrets SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID, and the repository
      #      variables SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG
      #      (Settings > Secrets and variables > Actions).
      #   3. Set the repository variable WINVELO_SIGNING to "signpath".
      # Check the SignPath action's README for its current version and inputs before enabling it.
      # ------------------------------------------------------------------------------------------
      - name: Upload unsigned exe files for signing
        id: unsigned
        if: ${{ vars.WINVELO_SIGNING == 'signpath' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: |
            dist/WinVelo-v${{ steps.version.outputs.version }}-portable/WinVelo.exe
            dist/WinVelo-v${{ steps.version.outputs.version }}-portable/winvelo-cli.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.WINVELO_SIGNING == 'signpath' }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/WinVelo-v${{ steps.version.outputs.version }}-portable

      - name: Check signatures
        if: ${{ vars.WINVELO_SIGNING == 'signpath' }}
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem "dist/WinVelo-v${{ steps.version.outputs.version }}-portable/*.exe") {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') { throw "$($exe.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($exe.Name): $($sig.SignerCertificate.Subject)"
          }

      - name: Zip and write SHA-256 hash files
        shell: pwsh
        run: .\build\publish.ps1 -Version "${{ steps.version.outputs.version }}" -PackageOnly

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/WinVelo-v${{ steps.version.outputs.version }}-portable.zip
            dist/WinVelo-v${{ steps.version.outputs.version }}-portable/WinVelo.exe
            dist/WinVelo-v${{ steps.version.outputs.version }}-portable/winvelo-cli.exe

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ver = "${{ steps.version.outputs.version }}"
          $zip = "dist/WinVelo-v$ver-portable.zip"
          $hash = (Get-Content "$zip.sha256" -Raw).Split(' ')[0]
          $signed = "${{ vars.WINVELO_SIGNING }}" -eq "signpath"
          $signing = if ($signed) {
            "The exe files are code-signed."
          } else {
            "The exe files are **not code-signed** yet, so Windows SmartScreen may warn you. Check the hash below or the build attestation before you run them."
          }

          $notes = @"
          ## WinVelo $tag

          **Download:** ``WinVelo-v$ver-portable.zip``. Unzip it and run ``WinVelo.exe``. Nothing to install, no .NET download.

          ### Verify your download
          $signing

          SHA-256 of ``WinVelo-v$ver-portable.zip``:
          ``````
          $hash
          ``````

          ``````powershell
          (Get-FileHash .\WinVelo-v$ver-portable.zip -Algorithm SHA256).Hash -eq '$hash'
          gh attestation verify .\WinVelo-v$ver-portable.zip --repo ${{ github.repository }}
          ``````

          See the [README](https://github.com/${{ github.repository }}#verify-your-download) and the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          "@

          gh release create $tag --draft --verify-tag --title "WinVelo $tag" --notes $notes `
            $zip "$zip.sha256" "dist/SHA256SUMS.txt"
