name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore WinVelo.sln

    - name: Validate Catalog JSON
      run: dotnet run --project tools/CatalogValidator/CatalogValidator.csproj

    - name: Build Solution
      run: dotnet build WinVelo.sln --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test WinVelo.sln --configuration Release --no-build --verbosity normal
